name: DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pygoat:ci .

      - name: Django system check inside container
        run: >
          docker run --rm
          -e POSTGRES_DB -e POSTGRES_USER -e POSTGRES_PASSWORD
          pygoat:ci python manage.py check
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

  secrets-scan:
    name: Secrets Scan - Gitleaks (blocking)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST - Semgrep (report)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep and save JSON
        run: semgrep scan --config auto --json --output semgrep-results.json
        continue-on-error: true

      - name: Print finding count
        run: echo "SEMGREP FINDINGS:" $(grep -o '"check_id"' semgrep-results.json | wc -l)

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  dependency-scan:
    name: Dependency Scan - pip-audit (report)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit pinned requirements
        run: |
          grep '==' requirements.txt > requirements-pinned.txt
          pip-audit -r requirements-pinned.txt --no-deps --disable-pip
        continue-on-error: true

  container-scan:
    name: Container Scan - Trivy (report)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t pygoat:scan .

      - name: Trivy image scan
        run: >
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:latest image
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          pygoat:scan
        continue-on-error: true
